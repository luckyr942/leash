<!doctype html><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1500px;height:1000px;overflow:hidden}
body{font-family:"Plus Jakarta Sans",sans-serif;color:#fff;background:#0a0c11;position:relative}
.glow{position:absolute;inset:0;background:radial-gradient(700px 420px at 18% -10%,rgba(110,193,255,.28),transparent 60%),radial-gradient(600px 400px at 100% 110%,rgba(64,110,255,.18),transparent 60%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at 30% 30%,#000 30%,transparent 75%)}
.l{position:absolute;left:90px;top:150px;width:720px}
.brand{display:flex;align-items:center;gap:16px;font-weight:800;font-size:44px;letter-spacing:-.04em}
h1{font-weight:800;font-size:88px;line-height:1.0;letter-spacing:-.05em;margin:70px 0 30px}
h1 em{font-style:normal;color:#6EC1FF}
p{margin:0;font-size:29px;line-height:1.45;color:rgba(255,255,255,.7);font-weight:500;max-width:640px}
.pp{position:absolute;left:90px;bottom:120px;display:flex;align-items:center;gap:12px;font-size:23px;padding:14px 22px !important;font-weight:600;color:rgba(255,255,255,.8);padding:10px 16px;border:1px solid rgba(255,255,255,.14);border-radius:999px;background:rgba(255,255,255,.04)}
.shot{position:absolute;left:860px;top:170px;width:980px;border-radius:16px;overflow:hidden;box-shadow:0 40px 90px -20px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.12);transform:perspective(1600px) rotateY(-14deg) rotateX(4deg);transform-origin:left center}
.shot img{display:block;width:100%}
</style>
<div class="glow"></div><div class="grid"></div>
<div class="l">
